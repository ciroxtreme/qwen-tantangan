name: Qwen Login Challenge (Camoufox Stealth)

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email target untuk login"
        required: true
        default: "tuanciroxtreme@gmail.com"

jobs:
  run-challenge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          pip install "camoufox[geoip]" opencv-python-headless numpy
          camoufox fetch

      - name: Run Login Challenge with Camoufox & Virtual Display
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_EMAIL: ${{ github.event.inputs.email }}
        run: |
          xvfb-run -a python login_challenge.py
