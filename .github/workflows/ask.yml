name: Ask Qwen 4 Max Relay (Camoufox Stealth)

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Pertanyaan untuk Qwen 4 Max"
        required: true
        default: "Halo Qwen, tes respon 1 kata: READY"

jobs:
  ask-qwen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Camoufox Browser
        id: camoufox-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/camoufox
          key: ${{ runner.os }}-camoufox-browser-v1

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          pip install "camoufox[geoip]" opencv-python-headless numpy
          camoufox fetch

      - name: Run Ask Relay with Camoufox
        run: |
          xvfb-run -a python ask_relay.py "${{ github.event.inputs.prompt }}"

      - name: Commit Updated Session If Changed
        run: |
          git config user.name "Ciro Session Bot"
          git config user.email "ciro@automated.local"
          git add session_qwen.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-refresh persistent session [skip ci]" && git push origin main)
