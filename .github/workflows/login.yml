name: Qwen Login Challenge & Relay (Camoufox Stealth)

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email target untuk login"
        required: true
        default: "tuanciroxtreme@gmail.com"
      prompt:
        description: "Pertanyaan opsional untuk Qwen"
        required: false
        default: ""

jobs:
  run-challenge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Camoufox Browser
        id: camoufox-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/camoufox
          key: ${{ runner.os }}-camoufox-browser-v1

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          pip install "camoufox[geoip]" opencv-python-headless numpy
          camoufox fetch

      - name: Run Login & Relay Engine with Camoufox
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_EMAIL: ${{ github.event.inputs.email }}
          PROMPT_ASK: ${{ github.event.inputs.prompt }}
        run: |
          xvfb-run -a python login_challenge.py "${{ github.event.inputs.prompt }}"

      - name: Commit Updated Session If Changed
        run: |
          git config user.name "Ciro Session Bot"
          git config user.email "ciro@automated.local"
          git add session_qwen.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-persist session_qwen.json [skip ci]" && git push https://ciroxtreme:${{ secrets.GH_PAT }}@github.com/ciroxtreme/qwen-tantangan.git main)
