name: Qwen Login Challenge & Relay (Playwright Stealth & WARP)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      email:
        description: "Email target untuk login"
        required: true
        default: "tuanciroxtreme@gmail.com"
      prompt:
        description: "Pertanyaan opsional untuk Qwen"
        required: false
        default: ""

jobs:
  run-challenge:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Restore Qwen session from secret
        env:
          QWEN_SESSION_JSON: ${{ secrets.QWEN_SESSION_JSON }}
      run: |
        if [ -n "$QWEN_SESSION_JSON" ]; then
          printf '%s' "$QWEN_SESSION_JSON" > session_qwen.json
          echo "Session restored from secret."
      else
        echo "No QWEN_SESSION_JSON secret yet; using repo session file if present."
    fi
  
      - name: Install & Setup Official Cloudflare WARP SOCKS5 Tunnel
        run: |
          echo "📥 Memasang Cloudflare WARP client resmi..."
          export DEBIAN_FRONTEND=noninteractive
          curl -fsSL -o /tmp/warp.deb https://pkg.cloudflareclient.com/pool/jammy/main/c/cloudflare-warp/cloudflare-warp_2024.11.309.0_amd64.deb || curl -fsSL -o /tmp/warp.deb https://pkg.cloudflareclient.com/pool/jammy/main/c/cloudflare-warp/cloudflare-warp_2024.6.497.0_amd64.deb || true

          if [ -f /tmp/warp.deb ] && [ $(stat -c%s /tmp/warp.deb) -gt 1000000 ]; then
            sudo dpkg -i /tmp/warp.deb || true
          else
            curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ jammy main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
            sudo apt-get update -y -o Dir::Etc::sourcelist="sources.list.d/cloudflare-client.list" -o Dir::Etc::sourceparts="-" -o APT::Get::List-Cleanup="0"
            sudo apt-get install -y --no-install-recommends cloudflare-warp
          fi

          sudo systemctl start warp-svc
          sleep 1

          warp-cli --accept-tos registration new || warp-cli --accept-tos register || true
          warp-cli --accept-tos mode proxy || true
          warp-cli --accept-tos proxy port 40000 || true
          warp-cli --accept-tos connect || true

          sleep 2
          echo "✅ Status WARP:"
          warp-cli --accept-tos status || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Playwright Browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-v1

      - name: Fast Setup Playwright & Dependencies
        run: |
          pip install --no-cache-dir playwright playwright-stealth opencv-python-headless numpy requests
          if [ ! -d ~/.cache/ms-playwright ] || [ -z "$(ls -A ~/.cache/ms-playwright 2>/dev/null)" ]; then
            playwright install chromium
          fi

      - name: Run Qwen Relay with Playwright
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_EMAIL: ${{ github.event.inputs.email || 'tuanciroxtreme@gmail.com' }}
          PROMPT_ASK: ${{ github.event.inputs.prompt || '' }}
          PYTHONUNBUFFERED: "1"
        run: |
          xvfb-run -a python -u login_challenge.py "${{ github.event.inputs.prompt || '' }}"

      - name: Save Qwen session to secret
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
      run: |
        if [ -f session_qwen.json ] && [ -s session_qwen.json ]; then
          gh secret set QWEN_SESSION_JSON --repo ciroxtreme/qwtt < session_qwen.json
          echo "Session saved to secret."
      else
        echo "No session file to save."
    fi
